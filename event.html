<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    >

    <meta name="theme-color" content="#05070b">

    <meta
        name="description"
        content="Cartelera oficial, combates y resultados de los eventos de MI WRESTLING 2.0."
    >

    <title>Evento | MI WRESTLING 2.0</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Estilos globales: misma base que Alumni -->
    <link rel="stylesheet" href="css/mi-wrestling.css">

    <!-- Estilos específicos del evento -->
    <link rel="stylesheet" href="css/pages/event.css">

    <!-- Componente visual de los combates -->
    <link rel="stylesheet" href="css/components/match-card.css">

    <!-- Componente de tarjetas de combate -->
    <script src="js/components/match-card.js" defer></script>

    <!-- Lógica de la página de evento individual -->
    <script src="js/pages/event.js" defer></script>

    <!-- Sistema global: navegación, tema y pie de página -->
    <script src="js/mi-wrestling.js" defer></script>

    <!-- Efectos de sonido globales -->
    <script src="js/sound-effects.js" defer></script>
</head>

<body data-page="event">

    <!-- El sistema global inserta aquí la navegación -->

    <main
        class="site-main mw-event-page"
        data-event-main
    >

        <!-- Encabezado inicial mientras carga el evento -->
        <header class="mw-page-header">
            <div class="mw-event-hero-content">

                <div class="mw-event-eyebrow">
                    MI WRESTLING 2.0
                    <span>/</span>
                    EVENT ARCHIVE
                </div>

                <h1 class="mw-event-title">
                    EVENTO
                </h1>

                <p class="mw-event-description">
                    Cartelera oficial, combates y resultados.
                </p>

            </div>
        </header>

        <!-- El JavaScript reemplaza este contenido con el evento -->
        <section
            class="mw-event-content"
            aria-live="polite"
        >
            <p class="mw-catalog-loading">
                CARGANDO EVENTO Y CARTELERA…
            </p>
        </section>

    </main>

    <!-- El sistema global administra el pie de página -->

</body>
</html>
