<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    >

    <meta name="theme-color" content="#05070b">

    <meta
        name="description"
        content="Reglamento oficial de MI WRESTLING 2.0: normas de competición, horarios, puntuación y sanciones."
    >

    <title>Reglas | MI WRESTLING 2.0</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- SISTEMA GLOBAL -->
    <link rel="stylesheet" href="css/mi-wrestling.css">
    <script src="js/mi-wrestling.js" defer></script>
    <script src="js/sound-effects.js" defer></script>

    <!-- CSS ESPECÍFICO DE REGLAS -->
    <link rel="stylesheet" href="css/pages/rules.css">

    <!-- JS ESPECÍFICO DE REGLAS -->
    <script src="js/pages/rules.js" defer></script>
</head>

<body data-page="rules">

    <!-- El sistema global puede insertar aquí la navegación -->

    <main class="site-main mw-rules-page">

        <!-- ENCABEZADO -->
        <header class="mw-page-header rules-hero">
            <div class="rules-hero-content">

                <div class="rules-eyebrow">
                    <span>MI WRESTLING 2.0</span>
                    <span> / </span>
                    <span>COMPETITION MANUAL</span>
                </div>

                <h1 class="rules-title">
                    REGLAMENTO
                </h1>

                <p class="rules-description">
                    Las normas que rigen la competición.
                    <span>
                        Reglamento oficial y protocolos para árbitros.
                    </span>
                </p>

            </div>
        </header>

        <!-- SECCIONES DEL REGLAMENTO -->
        <section
            id="reglamento-oficial"
            class="rules-section"
        >
            <h2>Reglamento Oficial</h2>

            <div id="official-rules-content">
                <p class="rules-loading">
                    CARGANDO REGLAMENTO…
                </p>
            </div>
        </section>

        <section
            id="manual-arbitros"
            class="rules-section"
        >
            <h2>Manual de Árbitros</h2>

            <div id="referee-manual-content">
                <p class="rules-loading">
                    CARGANDO MANUAL DE ÁRBITROS…
                </p>
            </div>
        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="footer">
        MI WRESTLING 2.0 · REGLAMENTO OFICIAL
    </footer>

</body>
</html>
