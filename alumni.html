<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    >

    <meta name="theme-color" content="#05070b">

    <meta
        name="description"
        content="Archivo de leyendas, superestrellas retiradas y antiguos luchadores de MI WRESTLING 2.0."
    >

    <title>Alumni | MI WRESTLING 2.0</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Compatibilidad con la arquitectura anterior -->
    <link rel="stylesheet" href="css/mi-wrestling.css">

    <!-- Estilos específicos de roster y alumni -->
    <link rel="stylesheet" href="css/pages/roster-pages.css">



    <!-- DATOS Y SISTEMA ANTERIOR DE LUCHADORES -->
    <script src="js/wrestlers.js" defer></script>

    <!-- COMPONENTES Y CATÁLOGO NUEVO -->
    <script src="js/components/wrestler-card.js" defer></script>
    <script src="js/pages/wrestlers-catalog.js" defer></script>

    <!-- SISTEMA GLOBAL ANTERIOR -->
    <script src="js/mi-wrestling.js" defer></script>
</head>

<body
    data-page="alumni"
    data-wrestler-status="inactive"
    data-wrestlers-catalog="alumni"
>

    <!-- El sistema global puede insertar aquí la navegación -->

    <main class="site-main mw-roster-page">

        <!-- ENCABEZADO -->
        <header class="mw-page-header">
            <p class="eyebrow">HALL OF LEGENDS / LEGACY ARCHIVE</p>

            <h1 class="page-title">ALUMNI</h1>

            <p class="lead">
                Leyendas, retirados e íconos que dejaron su marca en el ring.
            </p>
        </header>

       

        <!-- FILTROS POR MARCA -->
        <section
            class="mw-brand-filter-panel"
            aria-label="Filtrar por marca"
        >
            <div class="mw-filter-panel-heading">
                <span class="mw-filter-kicker">SELECT BRAND</span>

                <strong>EXPLORAR POR MARCA</strong>

                <span
                    class="mw-catalog-count"
                    data-wrestler-count
                >
                    PREPARANDO LEYENDAS
                </span>
            </div>

            <div
                class="mw-brand-filters"
                data-brand-filters
                role="group"
                aria-label="Marcas disponibles"
            >
                <span class="mw-catalog-loading">
                    CARGANDO MARCAS…
                </span>
            </div>
        </section>

        

        <!-- CATÁLOGO -->
        <section
            id="wrestler-grid"
            class="mw-wrestler-grid roster-grid-container"
            aria-label="Archivo de alumni"
            aria-live="polite"
        >
            <p class="mw-catalog-loading">
                CARGANDO ARCHIVO DE LEYENDAS…
            </p>
        </section>

    </main>

    <!-- MODAL DEL SISTEMA ANTERIOR -->
    <div
        class="mw-modal-root"
        id="mw-modal-root"
    ></div>

    <!-- PIE DE PÁGINA -->
    <footer class="footer">
        MI WRESTLING 2.0 · HALL OF LEGENDS
    </footer>

</body>
</html>
