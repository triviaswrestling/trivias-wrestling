<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#05070b">
  <meta
    name="description"
    content="Archivo de leyendas, retirados e íconos de MI WRESTLING 2.0."
  >

  <title>Alumni | MI WRESTLING 2.0</title>

  <!-- FUENTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS GLOBAL Y ALUMNI -->
  <link rel="stylesheet" href="css/mi-wrestling.css">
  <link rel="stylesheet" href="css/pages/roster-pages.css">

  <!-- JAVASCRIPT GLOBAL -->
  <script src="js/mi-wrestling.js" defer></script>

  <!-- DATOS DE LAS SUPERSTRELLAS -->
  <script src="js/wrestlers.js" defer></script>
</head>

<body data-page="alumni" data-wrestler-status="alumni">

  <main class="mw-roster-page">

    <!-- ENCABEZADO -->
    <header class="mw-page-header">
      <p class="eyebrow">HALL OF LEGENDS / LEGACY ARCHIVE</p>

      <h1 class="page-title">ALUMNI</h1>

      <p class="lead">
        Leyendas, retirados e íconos que dejaron su marca en el ring.
      </p>
    </header>

    <!-- BUSCADOR Y FILTROS -->
    <section
      class="mw-roster-toolbar"
      aria-label="Buscar y filtrar superestrellas"
    >
      <input
        id="wrestler-search"
        type="search"
        placeholder="Buscar superestrella…"
        aria-label="Buscar superestrella"
        autocomplete="off"
      >

      <select
        id="wrestler-brand"
        aria-label="Filtrar por marca"
      >
        <option value="">Todas las marcas</option>
        <option value="raw">RAW</option>
        <option value="smackdown">SmackDown</option>
        <option value="nxt">NXT</option>
        <option value="legends">Leyendas</option>
        <option value="special">Especial</option>
      </select>

      <span id="wrestler-count" aria-live="polite"></span>
    </section>

    <!-- CATÁLOGO DE LUCHADORES -->
    <section
      id="wrestler-grid"
      class="mw-wrestler-grid"
      aria-label="Archivo de superestrellas"
    >
      <p class="mw-loading">
        Cargando archivo de leyendas…
      </p>
    </section>

  </main>

  <!-- MODAL DE PERFIL -->
  <div class="mw-modal-root" id="mw-modal-root"></div>

</body>
</html>
